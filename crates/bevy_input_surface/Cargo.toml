[package]
name = "bevy_input_surface"
version = "0.1.0"
edition = "2024"
description = "Runtime enumeration of a Bevy game's declared input surface: UI interactables, focus targets, and raw-input readers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevyengine/bevy"
keywords = ["bevy", "input", "introspection", "testing", "accessibility"]

[dependencies]
# Minimal, render-decoupled subset of Bevy sufficient for input surface
# enumeration. `bevy_ui` no longer depends on `bevy_render` in 0.20
# (extraction lives in `bevy_ui_render`), so this stays headless-friendly.
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev", features = [
  "serialize",
] }
bevy_camera = { path = "../bevy_camera", version = "0.20.0-dev" }
bevy_input = { path = "../bevy_input", version = "0.20.0-dev" }
bevy_input_focus = { path = "../bevy_input_focus", version = "0.20.0-dev" }
bevy_picking = { path = "../bevy_picking", version = "0.20.0-dev" }
bevy_ui = { path = "../bevy_ui", version = "0.20.0-dev" }
bevy_ui_widgets = { path = "../bevy_ui_widgets", version = "0.20.0-dev" }
bevy_window = { path = "../bevy_window", version = "0.20.0-dev" }
bevy_a11y = { path = "../bevy_a11y", version = "0.20.0-dev" }
bevy_math = { path = "../bevy_math", version = "0.20.0-dev" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# For headless UI-layout test bootstrapping (mirror bevy_ui's own test env).
bevy_transform = { path = "../bevy_transform", version = "0.20.0-dev" }
bevy_text = { path = "../bevy_text", version = "0.20.0-dev" }
bevy_sprite = { path = "../bevy_sprite", version = "0.20.0-dev" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev" }
bevy_image = { path = "../bevy_image", version = "0.20.0-dev" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0-dev" }
bevy_time = { path = "../bevy_time", version = "0.20.0-dev" }
bevy_utils = { path = "../bevy_utils", version = "0.20.0-dev" }

[lints]
workspace = true
